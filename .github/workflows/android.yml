name: Android APK

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK preinstalled (ANDROID_HOME set);
      # android-actions/setup-android is broken on cmdline-tools 16.0 (tries
      # to install the removed 'tools' package), so call sdkmanager directly
      - name: Install Android NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;26.3.11579264" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Stage SDL2 for ndk-build
        run: sh android/fetch-sdl.sh

      - name: Build debug APK
        env:
          AR_ANDROID_KEYSTORE: ${{ secrets.AR_ANDROID_KEYSTORE }}
          AR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AR_ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android --no-daemon assembleDebug

      - name: Verify native entry point
        run: |
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk \
            lib/arm64-v8a/libmain.so > /tmp/libmain.so
          nm -D /tmp/libmain.so | grep -q ' T SDL_main$'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/.*\.DTX"

      - uses: actions/upload-artifact@v4
        with:
          name: ar-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
