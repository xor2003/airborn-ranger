name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      # The port itself builds asset-free: the guest image is generated
      # source (port/memimg.c + port/gen/). Only data-driven tests need the
      # original files, which are not in the repo.
      - name: Build port
        run: make -C port -j"$(nproc)"

      # make check builds+runs all six test binaries; test_game self-skips
      # its .DTX corpus when game data is absent (CI is always asset-free).
      - name: Unit tests
        run: make -C port check

      # e2e drives real gameplay and needs the original files; it prints
      # SKIP and exits 0 when they are absent (always the case on CI).
      - name: E2E (self-skips without game data)
        run: bash port/tests/e2e.sh
