plugins {
    id "com.android.application"
}

android {
    namespace "org.airborn"
    compileSdk 35
    ndkVersion "26.3.11579264"

    // Optional release signing: set AR_ANDROID_KEYSTORE + AR_ANDROID_KEYSTORE_PASSWORD.
    // Without them the debug key is used (sideloading still works, but each
    // machine's debug key differs so APKs can't update in place).
    def signingPath = System.getenv("AR_ANDROID_KEYSTORE")
    if (signingPath) {
        def signingPassword = System.getenv("AR_ANDROID_KEYSTORE_PASSWORD")
        if (!signingPassword) throw new GradleException("Missing Android signing password")
        signingConfigs {
            persistent {
                storeFile file(signingPath)
                storePassword signingPassword
                keyAlias "airborn"
                keyPassword signingPassword
            }
        }
        buildTypes.debug.signingConfig = signingConfigs.persistent
    }

    defaultConfig {
        applicationId "org.airborn"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "0.1"

        externalNativeBuild {
            ndkBuild {
                abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
            }
        }
    }

    sourceSets {
        main {
            jni.srcDirs = []
            // Game data ships inside the APK and is extracted to filesDir by
            // MainActivity. Pull the files straight from the repo root instead
            // of duplicating them under android/.
            assets {
                srcDir "../../"
                include "*.DTX", "*.DAT", "*.MIJ", "*.EXE"
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file("jni/Android.mk")
        }
    }
}
